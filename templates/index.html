<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator - Bypass Anti-Hook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}

body{
background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 100%);
color:#e0e0e0;min-height:100vh;padding:20px;
}

.container{max-width:1400px;margin:0 auto}

header{text-align:center;padding:30px 0;margin-bottom:30px}

header h1{
font-size:2.5rem;
background:linear-gradient(90deg,#00d4ff,#7b2ff7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

header p{color:#888;font-size:.9rem}

.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}

.btn{
padding:10px 20px;border:none;border-radius:8px;
cursor:pointer;font-weight:600;font-size:.9rem;transition:all .3s;
}

.btn-primary{background:linear-gradient(90deg,#00d4ff,#7b2ff7);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,212,255,.4)}

.btn-secondary{background:#2a2a3e;color:#e0e0e0;border:1px solid #3a3a5e}
.btn-secondary:hover{background:#3a3a5e}

.btn-danger{background:#8b1a1a;color:#fff}
.btn-danger:hover{background:#a02020}

.editor-container{
display:grid;grid-template-columns:1fr 1fr;
gap:20px;margin-bottom:20px;
}

@media(max-width:900px){.editor-container{grid-template-columns:1fr}}

.editor-box{background:#12121a;border-radius:12px;border:1px solid #2a2a3e;overflow:hidden}

.editor-header{
padding:12px 16px;background:#1a1a2e;
border-bottom:1px solid #2a2a3e;
display:flex;justify-content:space-between;align-items:center;
}

.editor-header span{font-weight:600;color:#00d4ff;font-size:.85rem}
.editor-header .char-count{color:#666;font-size:.75rem}

textarea{
width:100%;height:400px;background:#0d0d14;border:none;
color:#e0e0e0;padding:16px;
font-family:'Consolas','Monaco',monospace;
font-size:13px;line-height:1.6;resize:vertical;outline:none;
}

textarea::placeholder{color:#444}

.options-panel{
background:#12121a;border-radius:12px;border:1px solid #2a2a3e;
padding:20px;margin-bottom:20px;
}

.options-panel h3{color:#7b2ff7;margin-bottom:15px;font-size:1rem}

.options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}

.option-item{display:flex;align-items:center;gap:8px}

.option-item input[type="checkbox"]{
width:18px;height:18px;accent-color:#00d4ff;cursor:pointer;
}

.option-item label{font-size:.85rem;color:#aaa;cursor:pointer}

.status-bar{
padding:10px 16px;background:#1a1a2e;border-radius:8px;
font-size:.8rem;color:#888;display:flex;justify-content:space-between;
}

.status-bar .success{color:#00ff88}
.status-bar .error{color:#ff4444}

.file-input-wrapper{position:relative;overflow:hidden;display:inline-block}

.file-input-wrapper input[type="file"]{
position:absolute;left:0;top:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🔐 Lua Obfuscator</h1>
<p>Bypass Anti-Hook • Anti-Raw • Anti-Crack • Delta X</p>
</header>

<div class="toolbar">
<div class="file-input-wrapper">
<button class="btn btn-secondary">📁 Chọn file Lua</button>
<input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
</div>
<button class="btn btn-primary" onclick="obfuscate()">⚡ Obfuscate</button>
<button class="btn btn-secondary" onclick="copyOutput()">📋 Copy All</button>
<button class="btn btn-secondary" onclick="downloadOutput()">⬇️ Tải xuống</button>
<button class="btn btn-danger" onclick="clearInput()">🗑️ Clear</button>
<button class="btn btn-danger" onclick="clearAll()">🧹 Clear All</button>
</div>

<div class="options-panel">
<h3>⚙️ Tùy chọn bảo vệ</h3>
<div class="options-grid">
<div class="option-item">
<input type="checkbox" id="vmProtect" checked>
<label for="vmProtect">VM Protection (mạnh nhất)</label>
</div>
<div class="option-item">
<input type="checkbox" id="encodeStrings" checked>
<label for="encodeStrings">Mã hóa chuỗi (Base64)</label>
</div>
<div class="option-item">
<input type="checkbox" id="scramble">
<label for="scramble">Scramble Control Flow</label>
</div>
<div class="option-item">
<input type="checkbox" id="loadstringMode">
<label for="loadstringMode">Wrap loadstring (Delta X)</label>
</div>
</div>
</div>

<div class="editor-container">
<div class="editor-box">
<div class="editor-header">
<span>📥 Input Code</span>
<span class="char-count" id="inputCount">0 ký tự</span>
</div>
<textarea id="inputCode" placeholder="Dán code Lua của bạn vào đây..." oninput="updateCount()"></textarea>
</div>

<div class="editor-box">
<div class="editor-header">
<span>📤 Output Code</span>
<span class="char-count" id="outputCount">0 ký tự</span>
</div>
<textarea id="outputCode" placeholder="Code đã obfuscate sẽ hiện ở đây..." readonly></textarea>
</div>
</div>

<div class="status-bar">
<span id="statusText">Sẵn sàng</span>
<span id="statusDetail">v1.0.0</span>
</div>

</div>

<script>
function updateCount(){
var i=document.getElementById('inputCode');
var o=document.getElementById('outputCode');
document.getElementById('inputCount').textContent=i.value.length+' ký tự';
document.getElementById('outputCount').textContent=o.value.length+' ký tự';
}

function loadFile(event){
var file=event.target.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
document.getElementById('inputCode').value=e.target.result;
updateCount();
setStatus('Đã load file: '+file.name,'success');
};
reader.readAsText(file);
}

async function obfuscate(){
var code=document.getElementById('inputCode').value.trim();
if(!code){setStatus('Vui lòng nhập code Lua!','error');return}

setStatus('Đang obfuscate...','');

try{
var options={
vmProtect:document.getElementById('vmProtect').checked,
encodeStrings:document.getElementById('encodeStrings').checked,
scramble:document.getElementById('scramble').checked,
loadstringMode:document.getElementById('loadstringMode').checked
};

var response=await fetch('/api/obfuscate',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({code:code,options:options})
});

var data=await response.json();

if(data.ok){
var output=data.output;
if(options.loadstringMode){
output='loadstring([==['+output+']==])()';
}
document.getElementById('outputCode').value=output;
updateCount();
setStatus('Obfuscate thành công!','success');
}else{
setStatus('Lỗi: '+data.error,'error');
}
}catch(error){
setStatus('Lỗi kết nối: '+error.message,'error');
}
}

function copyOutput(){
var output=document.getElementById('outputCode');
if(!output.value){setStatus('Không có gì để copy!','error');return}
navigator.clipboard.writeText(output.value).then(function(){
setStatus('Đã copy toàn bộ output!','success');
}).catch(function(){
output.select();
document.execCommand('copy');
setStatus('Đã copy!','success');
});
}

function downloadOutput(){
var output=document.getElementById('outputCode').value;
if(!output){setStatus('Không có gì để tải!','error');return}
var blob=new Blob([output],{type:'text/plain'});
var url=URL.createObjectURL(blob);
var link=document.createElement('a');
link.href=url;
link.download='obfuscated_script.lua';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
URL.revokeObjectURL(url);
setStatus('Đã tải file!','success');
}

function clearInput(){
document.getElementById('inputCode').value='';
updateCount();
setStatus('Đã xóa input','');
}

function clearAll(){
document.getElementById('inputCode').value='';
document.getElementById('outputCode').value='';
updateCount();
setStatus('Đã xóa tất cả','');
}

function setStatus(message,type){
var s=document.getElementById('statusText');
s.textContent=message;
s.className=type||'';
}
</script>
</body>
  </html>
